<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萬聖節 AR 隨機抓寶 - Halloween AR Monster Hunter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spooky: {
                            purple: '#1c0a35',
                            dark: '#0d021a',
                            orange: '#ff6b00',
                            green: '#00ff66',
                            yellow: '#ffd700',
                            red: '#e63946'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Sans+TC:wght@500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0d021a;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .font-spooky {
            font-family: 'Creepster', cursive, 'Noto Sans TC', sans-serif;
        }

        /* Float & Pulse Animations for Monster AR */
        @keyframes arFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-16px) rotate(3deg) scale(1.03); }
        }

        .ar-monster-float {
            animation: arFloat 3.2s ease-in-out infinite;
        }

        @keyframes radarPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .radar-pulse {
            animation: radarPulse 2s infinite ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track { background: #1c0a35; }
        ::-webkit-scrollbar-thumb { background: #ff6b00; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative overflow-hidden select-none bg-black">

    <!-- TOP HEADER / PROGRESS BAR -->
    <header class="w-full max-w-md bg-spooky-purple/90 border-b border-orange-500/40 p-3 px-4 flex justify-between items-center z-30 backdrop-blur-md shadow-lg shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-spooky-orange/20 border border-spooky-orange flex items-center justify-center text-spooky-orange animate-bounce">
                <i class="fa-solid fa-ghost text-lg"></i>
            </div>
            <div>
                <h1 class="font-spooky text-lg text-spooky-orange tracking-wider leading-none">HALLOWEEN AR</h1>
                <p class="text-[10px] text-purple-300 font-bold">萬聖捉捕大作戰</p>
            </div>
        </div>

        <!-- Counter & Handbook Entry Button -->
        <button onclick="openHandbook()" class="flex items-center bg-black/60 border border-orange-500/60 rounded-full px-3 py-1.5 shadow-md hover:bg-orange-500/20 active:scale-95 transition">
            <i class="fa-solid fa-book-skull text-spooky-yellow mr-2 text-sm"></i>
            <span class="text-xs text-gray-300">圖鑑: </span>
            <span id="collectedCounter" class="text-sm font-black text-spooky-green ml-1">0</span>
            <span class="text-xs text-gray-400">/8</span>
        </button>
    </header>

    <!-- MAIN AR CAMERA VIEWPORT CONTAINER -->
    <main class="w-full max-w-md flex-1 relative flex flex-col items-center justify-center overflow-hidden">
        
        <!-- REAL CAMERA VIDEO STREAM -->
        <video id="arVideo" class="absolute inset-0 w-full h-full object-cover hidden" playsinline autoplay muted></video>

        <!-- FALLBACK ANIMATED SPOOKY NIGHT BACKGROUND (When camera is disabled or PC) -->
        <div id="simulatedBg" class="absolute inset-0 bg-gradient-to-b from-spooky-dark via-spooky-purple to-black flex flex-col justify-between p-6 opacity-100 transition-opacity duration-500">
            <!-- Simulated Moon and Flying Bats -->
            <div class="flex justify-between items-start">
                <div class="w-20 h-20 rounded-full bg-yellow-100 shadow-[0_0_50px_rgba(255,255,200,0.8)] opacity-80 flex items-center justify-center border-2 border-yellow-200/50">
                    <div class="w-16 h-16 rounded-full bg-yellow-200/30"></div>
                </div>
                <div class="text-right text-purple-400/40 text-2xl space-y-2">
                    <p><i class="fa-solid fa-bat animate-pulse"></i></p>
                    <p class="mr-6"><i class="fa-solid fa-bat"></i></p>
                </div>
            </div>
            <!-- Spooky Grass/Grave Silhouette at bottom -->
            <div class="text-center text-purple-900/40 text-6xl">
                <i class="fa-solid fa-dharmachakra"></i> <i class="fa-solid fa-spaghetti-monster-flying"></i>
            </div>
        </div>

        <!-- Camera Status Indicator Overlay -->
        <div class="absolute top-3 left-3 z-20 flex items-center gap-2 bg-black/60 backdrop-blur-sm border border-white/20 px-2.5 py-1 rounded-full text-[11px]">
            <span id="camStatusDot" class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
            <span id="camStatusText" class="text-gray-300">鏡頭準備中...</span>
            <button onclick="toggleCameraPermission()" class="ml-1 text-spooky-orange underline hover:text-orange-300">切換</button>
        </div>

        <!-- GAME INTERACTIVE CANVAS (Monster & Pumpkin Ball) -->
        <canvas id="arCanvas" class="absolute inset-0 w-full h-full z-10 touch-none"></canvas>

        <!-- SWIPE UP / CATCH HINT BANNER -->
        <div id="swipeHint" class="absolute bottom-16 z-20 text-center text-xs text-spooky-yellow bg-black/70 backdrop-blur-md px-4 py-1.5 rounded-full border border-yellow-500/40 shadow-lg animate-pulse pointer-events-none">
            <i class="fa-solid fa-hand-pointer mr-1"></i> 向上滑動 或 點擊下方按鈕拋球捕捉！
        </div>

    </main>

    <!-- BOTTOM FOOTER ACTION CONTROLS -->
    <footer class="w-full max-w-md bg-gradient-to-t from-black via-black/90 to-transparent p-4 pb-6 z-30 flex flex-col items-center gap-2 shrink-0">
        
        <!-- Primary Action Buttons -->
        <div class="w-full grid grid-cols-5 gap-2">
            <!-- Respawn Random Monster -->
            <button onclick="spawnRandomMonster()" class="col-span-2 py-3 bg-purple-900/80 hover:bg-purple-800 border border-purple-500/50 rounded-2xl text-xs font-bold text-purple-200 active:scale-95 transition flex items-center justify-center gap-1.5 shadow-md">
                <i class="fa-solid fa-shuffle text-spooky-orange"></i>
                <span>搜尋下一隻</span>
            </button>

            <!-- Throw Pumpkin Ball -->
            <button onclick="throwBall(true)" class="col-span-3 py-3 bg-gradient-to-r from-spooky-orange via-orange-500 to-yellow-500 text-black font-extrabold rounded-2xl text-sm shadow-[0_0_20px_rgba(255,107,0,0.5)] border border-yellow-200 active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>拋出南瓜球捕捉</span>
            </button>
        </div>

        <!-- Bottom Banner Info -->
        <div class="w-full flex justify-between items-center px-1 text-[11px] text-gray-400">
            <span><i class="fa-solid fa-circle-info text-spooky-green"></i> 捕捉概率：100% 解鎖</span>
            <button onclick="openHandbook()" class="text-spooky-yellow underline hover:text-yellow-300">查看圖鑑與兌換</button>
        </div>
    </footer>

    <!-- MODAL 1: CATCH SUCCESS DIALOG -->
    <div id="catchModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-spooky-purple to-black border-2 border-spooky-orange rounded-3xl p-6 max-w-xs w-full text-center relative shadow-[0_0_50px_rgba(255,107,0,0.6)] transform transition-all scale-100 animate-bounce-short">
            
            <div class="inline-block bg-spooky-green text-black font-black text-xs px-3.5 py-1 rounded-full mb-3 uppercase tracking-wider">
                🎉 成功捕獲！
            </div>

            <div id="modalMonsterIcon" class="text-7xl my-3 text-spooky-yellow ar-monster-float">
                👻
            </div>

            <h3 id="modalMonsterName" class="text-2xl font-black text-spooky-orange mb-1">搗蛋南瓜精</h3>
            <p id="modalMonsterTag" class="text-xs text-purple-300 mb-3">「如果不給糖，我就要毀掉你的南瓜湯！」</p>

            <p id="modalMonsterDesc" class="text-xs text-gray-300 bg-black/60 p-3 rounded-xl border border-purple-500/30 text-left leading-relaxed mb-5">
                生活在南瓜田裡的精靈，每到萬聖節夜裡就會發出金黃色微光。
            </p>

            <button onclick="closeCatchModal()" class="w-full py-3.5 bg-gradient-to-r from-spooky-orange to-yellow-500 text-black font-black rounded-xl shadow-lg active:scale-95 transition text-sm">
                收進圖鑑並繼續尋找
            </button>
        </div>
    </div>

    <!-- MODAL 2: MONSTER HANDBOOK (圖鑑) & REDEMPTION -->
    <div id="handbookModal" class="hidden fixed inset-0 bg-spooky-dark z-50 flex flex-col justify-between p-4 overflow-hidden">
        <!-- Handbook Header -->
        <div class="flex justify-between items-center mb-3 shrink-0">
            <h2 class="text-xl font-bold text-spooky-orange flex items-center gap-2">
                <i class="fa-solid fa-book-skull"></i> 萬聖怪獸小圖鑑
            </h2>
            <button onclick="closeHandbook()" class="w-8 h-8 rounded-full bg-purple-900/60 text-gray-300 flex items-center justify-center border border-purple-500/40">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Monster 8-Grid List -->
        <div id="handbookGrid" class="grid grid-cols-2 gap-3 flex-1 overflow-y-auto pr-1">
            <!-- JavaScript Injects 8 Monsters Here -->
        </div>

        <!-- Bottom Reward Action inside Handbook -->
        <div class="pt-3 border-t border-purple-500/40 flex justify-between items-center shrink-0 mt-2">
            <button onclick="confirmReset()" class="text-xs text-red-400 underline hover:text-red-300">
                <i class="fa-solid fa-trash-can mr-1"></i> 重置遊戲
            </button>

            <button id="rewardBtn" onclick="openVoucherModal()" disabled class="py-2.5 px-4 bg-gray-800 text-gray-500 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-not-allowed">
                <i class="fa-solid fa-gift"></i>
                兌換大獎 (0/8)
            </button>
        </div>
    </div>

    <!-- MODAL 3: SERVICE DESK VOUCHER & STAFF VERIFICATION -->
    <div id="voucherModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-lg z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-gradient-to-b from-purple-950 via-spooky-purple to-black border-2 border-yellow-400 rounded-3xl p-5 max-w-sm w-full text-center relative shadow-[0_0_50px_rgba(255,215,0,0.5)] my-auto">
            
            <button onclick="closeVoucherModal()" class="absolute top-3 right-3 text-gray-400 text-lg w-8 h-8 rounded-full bg-black/60 border border-gray-700">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="text-spooky-yellow text-4xl mb-1 mt-2">
                <i class="fa-solid fa-trophy animate-bounce"></i>
            </div>
            <h3 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-400 to-yellow-200">
                恭喜集齊 8 大萬聖怪獸！
            </h3>
            <p class="text-xs text-purple-300 mb-4">請出示此畫面至萬聖節服務台兌換禮品</p>

            <!-- Physical Voucher Ticket Box -->
            <div class="bg-white text-black p-4 rounded-2xl shadow-inner border-2 border-dashed border-orange-500 relative mb-4">
                <!-- Ticket Edge Cuts -->
                <div class="w-4 h-4 rounded-full bg-spooky-purple absolute -left-2 top-1/2 -translate-y-1/2"></div>
                <div class="w-4 h-4 rounded-full bg-spooky-purple absolute -right-2 top-1/2 -translate-y-1/2"></div>

                <p class="text-[10px] text-gray-500 tracking-widest font-bold">HALLOWEEN AR REWARD VIP PASS</p>
                <h4 class="text-lg font-extrabold text-purple-950 my-1">萬聖節現場大獎兌換券</h4>
                
                <!-- Barcode Graphics -->
                <div class="my-3 flex flex-col items-center">
                    <div class="h-10 w-44 bg-slate-900 flex justify-between p-1 items-center gap-0.5 rounded">
                        <div class="h-full w-1 bg-white"></div><div class="h-full w-2 bg-white"></div><div class="h-full w-0.5 bg-white"></div><div class="h-full w-3 bg-white"></div><div class="h-full w-1 bg-white"></div><div class="h-full w-2 bg-white"></div><div class="h-full w-0.5 bg-white"></div><div class="h-full w-3.5 bg-white"></div><div class="h-full w-1 bg-white"></div>
                    </div>
                    <span id="ticketCode" class="text-xs font-mono text-gray-700 mt-1 font-bold">HW-8888-2026</span>
                </div>

                <div id="redemptionStatus" class="text-xs font-bold text-green-700 bg-green-100 py-1 px-3 rounded-md inline-block">
                    ● 尚未核銷 (請向服務台出示)
                </div>
            </div>

            <!-- Service Desk Staff Redemption Input -->
            <div class="bg-black/60 p-3 rounded-2xl border border-purple-500/40 text-left">
                <p class="text-[11px] text-purple-300 font-bold mb-1.5"><i class="fa-solid fa-user-shield"></i> 服務台工作人員核銷區：</p>
                <div class="flex gap-2">
                    <input id="staffPassInput" type="password" placeholder="請輸入核銷密碼" class="bg-gray-900 border border-gray-700 text-xs rounded-xl p-2.5 flex-1 text-white focus:outline-none focus:border-orange-500">
                    <button onclick="verifyRedemption()" class="bg-spooky-orange hover:bg-orange-600 text-black font-extrabold text-xs px-3.5 rounded-xl transition">
                        確認核銷
                    </button>
                </div>
                <p class="text-[10px] text-gray-400 mt-1">預設密碼: <code class="text-yellow-400">8888</code> 或 <code class="text-yellow-400">halloween</code></p>
            </div>
        </div>
    </div>

    <script>
        /* ================= 1. MONSTER DATA DEFINITIONS ================= */
        const MONSTERS = [
            { id: 1, name: "搗蛋南瓜精", type: "植物系", icon: "🎃", desc: "生活在南瓜田裡的精靈，每到萬聖節夜裡就會發出金黃色微光。", tag: "「如果不給糖，我就要毀掉你的南瓜湯！」" },
            { id: 2, name: "幽靈小精靈", type: "幽靈系", icon: "👻", desc: "喜歡躲在角落嚇唬路人，但其實自己比誰都膽小。", tag: "「Boo！……哎呀被你發現了！」" },
            { id: 3, name: "萬聖骷髏人", type: "亡靈系", icon: "💀", desc: "身體經常跳舞跳到散架，但隨時都能重新組裝起來。", tag: "「我的關節有點幹咔響，但舞蹈不能停！」" },
            { id: 4, name: "吸血小蝙蝠", type: "飛行系", icon: "🦇", desc: "最喜歡喝新鮮的紅石榴汁，總是倒掛在城堡屋簷下。", tag: "「不要誤會，我真的只喝果汁啦！」" },
            { id: 5, name: "糖果巫婆", type: "魔法系", icon: "🧙‍♀️", desc: "大鍋裡煮著熬煉了七七四十九天的五彩軟糖大餐。", tag: "「嚐嚐我的萬聖特調魔法棒棒糖！」" },
            { id: 6, name: "黑貓魔法師", type: "超能系", icon: "🐈‍⬛", desc: "擁有預知未來的魔法大眼，戴著比自己還大的巫師帽。", tag: "「喵～這顆水晶球預測你今晚會拿到很多糖果！」" },
            { id: 7, name: "木乃伊寶寶", type: "詛咒系", icon: "🩹", desc: "身上的繃帶總是解不開，走路一蹦一跳非常可愛。", tag: "「誰能幫我把繃帶結解開一下？」" },
            { id: 8, name: "綠皮殭屍", type: "毒素系", icon: "🧟", desc: "喜歡隨音樂跳跳舞，擁有極高防禦力的萬聖節大魔王。", tag: "「今晚是我們的派對時間！」" }
        ];

        /* ================= 2. STATE VARIABLES ================= */
        let collectedSet = new Set();
        let currentMonster = null;
        let isRedeemed = false;
        let cameraStream = null;

        // Canvas & Physics Variables
        let canvas, ctx;
        let animFrameId;
        let ball = { x: 0, y: 0, radius: 26, isThrown: false, vx: 0, vy: 0, scale: 1, state: 'idle' };
        let monsterPos = { x: 0, y: 0, baseScale: 1, scale: 1, opacity: 1 };
        let particles = [];

        /* ================= 3. INITIALIZATION ================= */
        window.onload = function() {
            loadSavedProgress();
            initCanvas();
            initCamera();
            spawnRandomMonster();
            updateProgressUI();

            // Unique Voucher Code Generator
            if (!localStorage.getItem('hw_ar_ticket_code')) {
                const code = 'HW-' + Math.floor(1000 + Math.random() * 9000) + '-2026';
                localStorage.setItem('hw_ar_ticket_code', code);
            }
            document.getElementById('ticketCode').innerText = localStorage.getItem('hw_ar_ticket_code');

            window.addEventListener('resize', handleResize);
        };

        function loadSavedProgress() {
            const saved = localStorage.getItem('hw_ar_collected');
            if (saved) {
                try {
                    collectedSet = new Set(JSON.parse(saved));
                } catch(e) { console.error(e); }
            }
            isRedeemed = localStorage.getItem('hw_ar_redeemed') === 'true';
        }

        function saveProgress() {
            localStorage.setItem('hw_ar_collected', JSON.stringify(Array.from(collectedSet)));
            localStorage.setItem('hw_ar_redeemed', isRedeemed.toString());
        }

        function updateProgressUI() {
            document.getElementById('collectedCounter').innerText = collectedSet.size;

            // Check if all 8 are collected
            const rewardBtn = document.getElementById('rewardBtn');
            if (collectedSet.size >= 8) {
                rewardBtn.disabled = false;
                rewardBtn.className = "py-2.5 px-4 bg-gradient-to-r from-yellow-400 to-spooky-orange text-black font-extrabold rounded-xl text-xs transition flex items-center gap-1.5 shadow-lg animate-bounce cursor-pointer";
                rewardBtn.innerHTML = `<i class="fa-solid fa-trophy"></i> 兌換大獎 (已集齊!)`;
            } else {
                rewardBtn.disabled = true;
                rewardBtn.className = "py-2.5 px-4 bg-gray-800 text-gray-500 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-not-allowed";
                rewardBtn.innerHTML = `<i class="fa-solid fa-gift"></i> 兌換大獎 (${collectedSet.size}/8)`;
            }

            // Redemption Status UI
            const statusBox = document.getElementById('redemptionStatus');
            if (isRedeemed) {
                statusBox.className = "text-xs font-bold text-red-700 bg-red-100 py-1 px-3 rounded-md inline-block";
                statusBox.innerText = "✖ 已核銷 (已領取萬聖大獎)";
            } else {
                statusBox.className = "text-xs font-bold text-green-700 bg-green-100 py-1 px-3 rounded-md inline-block";
                statusBox.innerText = "● 尚未核銷 (請向服務台出示)";
            }
        }

        /* ================= 4. REAL CAMERA / AR LOGIC ================= */
        async function initCamera() {
            const video = document.getElementById('arVideo');
            const simBg = document.getElementById('simulatedBg');
            const statusDot = document.getElementById('camStatusDot');
            const statusText = document.getElementById('camStatusText');

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = cameraStream;
                video.classList.remove('hidden');
                simBg.classList.add('opacity-0');

                statusDot.className = "w-2 h-2 rounded-full bg-spooky-green animate-pulse";
                statusText.innerText = "AR 相機已啟動";
            } catch (err) {
                console.warn("Camera access denied or unavailable. Using simulated background.");
                video.classList.add('hidden');
                simBg.classList.remove('opacity-0');

                statusDot.className = "w-2 h-2 rounded-full bg-yellow-400";
                statusText.innerText = "萬聖虛擬實境";
            }
        }

        function toggleCameraPermission() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
                document.getElementById('arVideo').classList.add('hidden');
                document.getElementById('simulatedBg').classList.remove('opacity-0');
                document.getElementById('camStatusDot').className = "w-2 h-2 rounded-full bg-yellow-400";
                document.getElementById('camStatusText').innerText = "萬聖虛擬實境";
            } else {
                initCamera();
            }
        }

        /* ================= 5. RANDOM MONSTER SPAWN LOGIC ================= */
        function spawnRandomMonster() {
            // Prioritize uncollected monsters
            const uncollected = MONSTERS.filter(m => !collectedSet.has(m.id));
            if (uncollected.length > 0 && Math.random() < 0.8) {
                currentMonster = uncollected[Math.floor(Math.random() * uncollected.length)];
            } else {
                currentMonster = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
            }

            resetBallAndMonster();
        }

        /* ================= 6. CANVAS & PHYSICS ANIMATION ================= */
        function initCanvas() {
            canvas = document.getElementById('arCanvas');
            ctx = canvas.getContext('2d');
            handleResize();
            setupTouchEvents();
            startLoop();
        }

        function handleResize() {
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            resetBallAndMonster();
        }

        function resetBallAndMonster() {
            if (!canvas) return;

            // Ball Position at Bottom Center
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 85;
            ball.radius = 28;
            ball.isThrown = false;
            ball.vx = 0;
            ball.vy = 0;
            ball.scale = 1;
            ball.state = 'idle';

            // Monster Floating Position at Upper-Middle AR space
            monsterPos.x = canvas.width / 2;
            monsterPos.y = canvas.height * 0.35;
            monsterPos.opacity = 1;
            monsterPos.scale = 1;
        }

        function throwBall(direct = false) {
            if (ball.isThrown) return;

            ball.isThrown = true;
            ball.state = 'throwing';

            if (direct) {
                ball.vx = (Math.random() - 0.5) * 1.5;
                ball.vy = -15;
            }
        }

        function setupTouchEvents() {
            let startY = 0;
            let startX = 0;

            canvas.addEventListener('touchstart', (e) => {
                if (ball.isThrown) return;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
            });

            canvas.addEventListener('touchend', (e) => {
                if (ball.isThrown) return;
                const touch = e.changedTouches[0];
                const deltaY = touch.clientY - startY;
                const deltaX = touch.clientX - startX;

                // Swipe up detection
                if (deltaY < -25) {
                    ball.isThrown = true;
                    ball.state = 'throwing';
                    ball.vx = deltaX * 0.12;
                    ball.vy = Math.max(deltaY * 0.22, -22);
                }
            });
        }

        function createExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.5) * 9,
                    radius: Math.random() * 5 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        function startLoop() {
            let floatAngle = 0;

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                floatAngle += 0.035;
                const floatOffset = Math.sin(floatAngle) * 12;

                // 1. Draw AR Monster
                if (currentMonster && monsterPos.opacity > 0) {
                    ctx.save();
                    ctx.globalAlpha = monsterPos.opacity;
                    ctx.translate(monsterPos.x, monsterPos.y + floatOffset);
                    ctx.scale(monsterPos.scale, monsterPos.scale);

                    // AR Glow Effect behind monster
                    ctx.beginPath();
                    ctx.arc(0, 0, 50, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 107, 0, 0.15)';
                    ctx.fill();

                    // Render Monster Emoji
                    ctx.font = '72px serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(currentMonster.icon, 0, 0);

                    // Name Tag floating below
                    ctx.font = 'bold 12px Noto Sans TC, sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#ff6b00';
                    ctx.shadowBlur = 8;
                    ctx.fillText(currentMonster.name, 0, 48);

                    ctx.restore();
                }

                // 2. Physics Update for Pumpkin Ball
                if (ball.isThrown && ball.state === 'throwing') {
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    ball.scale *= 0.965; // Scale down as it flies away

                    // Check hit distance
                    const monsterY = monsterPos.y + floatOffset;
                    const distance = Math.hypot(ball.x - monsterPos.x, ball.y - monsterY);

                    // When ball reaches monster height level
                    if (ball.y <= monsterY + 15) {
                        if (distance < 65) {
                            // CATCH HIT
                            ball.state = 'hit';
                            createExplosion(monsterPos.x, monsterY, '#ff6b00', 30);
                            onCatchSuccess();
                        } else {
                            // MISSED
                            ball.state = 'miss';
                            setTimeout(resetBallAndMonster, 700);
                        }
                    }
                }

                // 3. Draw Pumpkin Ball
                if (ball.state !== 'hidden') {
                    ctx.save();
                    ctx.translate(ball.x, ball.y);
                    ctx.scale(ball.scale, ball.scale);

                    ctx.font = `${ball.radius * 2}px serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🎃', 0, 0);

                    ctx.restore();
                }

                // 4. Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.035;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(p.life, 0);
                    ctx.fill();

                    if (p.life <= 0) particles.splice(i, 1);
                }

                animFrameId = requestAnimationFrame(render);
            }

            render();
        }

        function onCatchSuccess() {
            monsterPos.opacity = 0;
            collectedSet.add(currentMonster.id);
            saveProgress();
            updateProgressUI();

            // Fireworks Confetti
            confetti({
                particleCount: 70,
                spread: 60,
                origin: { y: 0.6 }
            });

            setTimeout(showCatchModal, 500);
        }

        /* ================= 7. MODALS & HANDBOOK LOGIC ================= */
        function showCatchModal() {
            document.getElementById('modalMonsterIcon').innerText = currentMonster.icon;
            document.getElementById('modalMonsterName').innerText = currentMonster.name;
            document.getElementById('modalMonsterTag').innerText = currentMonster.tag;
            document.getElementById('modalMonsterDesc').innerText = currentMonster.desc;

            document.getElementById('catchModal').classList.remove('hidden');
        }

        function closeCatchModal() {
            document.getElementById('catchModal').classList.add('hidden');
            
            // Check if all 8 are collected
            if (collectedSet.size >= 8) {
                openHandbook();
            } else {
                spawnRandomMonster();
            }
        }

        function openHandbook() {
            renderHandbook();
            document.getElementById('handbookModal').classList.remove('hidden');
        }

        function closeHandbook() {
            document.getElementById('handbookModal').classList.add('hidden');
        }

        function renderHandbook() {
            const grid = document.getElementById('handbookGrid');
            grid.innerHTML = '';

            MONSTERS.forEach(m => {
                const isCaught = collectedSet.has(m.id);
                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl border flex flex-col items-center justify-between text-center relative overflow-hidden transition ${
                    isCaught 
                    ? 'bg-gradient-to-b from-purple-900/70 to-black/90 border-spooky-orange/70 shadow-md' 
                    : 'bg-black/50 border-gray-800 opacity-60'
                }`;

                card.innerHTML = `
                    <div class="text-[10px] font-bold self-start px-2 py-0.5 rounded-full ${isCaught ? 'bg-orange-500/30 text-orange-300 border border-orange-500/40' : 'bg-gray-800 text-gray-500'}">
                        #0${m.id}
                    </div>

                    <div class="text-5xl my-2 ${isCaught ? 'filter-none ar-monster-float' : 'brightness-0 contrast-200 opacity-25'}">
                        ${m.icon}
                    </div>

                    <div class="w-full">
                        <p class="text-xs font-bold ${isCaught ? 'text-spooky-orange' : 'text-gray-500'}">
                            ${isCaught ? m.name : '????'}
                        </p>
                        <p class="text-[10px] text-gray-400 mt-0.5">
                            ${isCaught ? m.type : '未抓取'}
                        </p>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function openVoucherModal() {
            document.getElementById('voucherModal').classList.remove('hidden');
        }

        function closeVoucherModal() {
            document.getElementById('voucherModal').classList.add('hidden');
        }

        function verifyRedemption() {
            const val = document.getElementById('staffPassInput').value.trim().toLowerCase();
            if (val === '8888' || val === 'halloween') {
                isRedeemed = true;
                saveProgress();
                updateProgressUI();
                alert('🎉 工作人員核銷成功！請將獎品交付給玩家。');
            } else {
                alert('❌ 密碼錯誤，請重新輸入（預設密碼：8888）。');
            }
        }

        function confirmReset() {
            if (confirm('確定要清空所有已抓取的小怪物紀錄嗎？')) {
                localStorage.removeItem('hw_ar_collected');
                localStorage.removeItem('hw_ar_redeemed');
                localStorage.removeItem('hw_ar_ticket_code');
                collectedSet.clear();
                isRedeemed = false;
                updateProgressUI();
                renderHandbook();
                spawnRandomMonster();
                alert('遊戲已重置！');
            }
        }
    </script>
</body>
